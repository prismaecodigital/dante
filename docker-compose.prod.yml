services:
  app:
    image: ${APP_IMAGE}
    container_name: dante-app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_STACK: ${LOG_STACK}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      CACHE_CONFIG: ${CACHE_CONFIG}
      TZ: ${APP_TIMEZONE}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: ${NGINX_IMAGE}
    container_name: dante-nginx
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE}
    depends_on:
      - app
    labels:
      - traefik.enable=true
      - traefik.docker.network=${APP_NETWORK}
      - traefik.http.routers.dante.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.dante.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.dante.tls=true
      - traefik.http.routers.dante.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.services.dante.loadbalancer.server.port=80
    networks:
      - internal

  scheduler:
    image: ${APP_IMAGE}
    container_name: dante-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_STACK: ${LOG_STACK}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: ${CACHE_STORE}
      SESSION_DRIVER: ${SESSION_DRIVER}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      TZ: ${APP_TIMEZONE}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: mysql:${MYSQL_VERSION}
    container_name: dante-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${APP_TIMEZONE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  adminer:
    image: adminer:${ADMINER_VERSION}
    container_name: dante-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      TZ: ${APP_TIMEZONE}
    ports:
      - "127.0.0.1:${ADMINER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  mysql-data:
    name: dante_mysql-data
  app-storage:
    name: dante_app-storage

networks:
  internal:
    name: ${APP_NETWORK}
    driver: bridge
