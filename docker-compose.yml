name: dante-dev

services:
  app:
    build:
      context: .
      target: dev
    image: prismaeco/dante-app:dev
    container_name: dante-dev-app
    restart: unless-stopped
    env_file: docker/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: "3306"
      RUN_MIGRATIONS: "true"
      CACHE_CONFIG: "false"
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: dante-dev-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  vite:
    image: node:26.12.1-alpine
    container_name: dante-dev-vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_VUE_APP_I18N_LOCALE: ${VITE_VUE_APP_I18N_LOCALE:-id}
      VITE_VUE_APP_I18N_FALLBACK_LOCALE: ${VITE_VUE_APP_I18N_FALLBACK_LOCALE:-id}
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - internal

  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: dante-dev-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dante}
      MYSQL_USER: ${DB_USERNAME:-dante}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/dump:/dump:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  adminer:
    image: adminer:4.8.1
    container_name: dante-dev-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  mysql-data:
    name: dante-dev_mysql-data
  node_modules:
    name: dante-dev_node_modules

networks:
  internal:
    name: dante-dev-internal
    driver: bridge
