; Application defaults for the PHP-FPM containers.
; OPcache is configured separately (see opcache.ini / opcache-dev.ini).

memory_limit = 512M
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 20

expose_php = Off
date.timezone = Asia/Jakarta

realpath_cache_size = 4096K
realpath_cache_ttl = 600
